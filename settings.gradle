rootProject.name = 'MirrorSync'

dependencyResolutionManagement {
    repositories {
        // 国内加速
        maven { url "https://maven.aliyun.com/repository/public" }
        // Minecraft Forge 官方仓库
        maven { url "https://maven.minecraftforge.net/" }
        // Maven Central
        mavenCentral()
    }
}

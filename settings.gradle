pluginManagement {
    repositories {
        // 国内加速优先，避免 fooyay-resolver HTTPS 握手失败
        maven { url "https://maven.aliyun.com/repository/public" }
        
        // Minecraft Forge 官方仓库
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }

        // Gradle 官方插件仓库
        gradlePluginPortal()
    }
}


name: Build MirrorSync 1.21.1

on:
  push:
    branches:
      - "1.21.1"
  pull_request:
    branches:
      - "1.21.1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and upload JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload build artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: MirrorSync-1.21.1-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Add artifact link to job summary
        run: |
          echo "### 构建产物" >> "$GITHUB_STEP_SUMMARY"
          echo "[下载 MirrorSync JAR](${{ steps.artifact.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  dependency-submission:
    name: Submit dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
